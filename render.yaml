services:
  - type: web
    name: epl-predictor
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: HISTORY_SEASONS
        value: 6
      - key: DATA_MAX_AGE_HOURS
        value: 12
      - key: REFRESH_CHECK_INTERVAL_SECONDS
        value: 300
