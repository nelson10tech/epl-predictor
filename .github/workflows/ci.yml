name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUTO_REFRESH: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run test suite
        run: pytest -q
      - name: Run model and leakage smoke checks
        run: python manage.py smoke_test
      - name: Confirm production app imports
        run: python -c "from wsgi import app; assert app is not None; print('app import ok')"
