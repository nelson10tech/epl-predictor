name: Live prediction snapshots

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-prediction-snapshots
  cancel-in-progress: false

jobs:
  snapshot-and-score:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTO_REFRESH: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Refresh current data when available
        run: python manage.py refresh || echo "::warning::Refresh failed; using the committed valid snapshot"
      - name: Record pre-match predictions
        run: python manage.py snapshot_predictions
      - name: Score completed predictions
        run: python manage.py score_predictions
      - name: Commit durable report changes
        run: |
          git restore --source=HEAD --staged --worktree data/raw
          git clean -f data/raw
          git add data/cache/upcoming_fixtures.json reports/live_predictions reports/live_results.json reports/live_performance.json
          if git diff --cached --quiet; then
            echo "No prediction or score changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record live prediction performance [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
